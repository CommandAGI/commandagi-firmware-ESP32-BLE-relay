; CommandAGI BLE control-relay firmware — the cross-app / iOS pointer.
;
; The relay pairs to a phone as a standard Bluetooth HID mouse + keyboard + absolute pointer, so the
; phone's OS accepts synthesized pointer/key events SYSTEM-WIDE (on iOS via the AssistiveTouch pointer —
; a third-party app can't synthesize touch into other apps, but the OS honors a paired BT pointer). Our
; app connects to the relay's custom GATT service (the shared CommandAGI provisioning service, so the app
; recognizes it) and writes `HidControl` intents to the HID characteristic; the firmware maps each intent
; onto raw HID reports it emits to the phone.
;
; Unlike the camera/arm firmware, the relay does NOT use Wi-Fi or the cloud — it is a pure BLE HID
; accessory. So there is no streaming, no account provisioning required; just BLE.
;
; Build/flash:  pio run -e esp32s3 -t upload && pio device monitor
;
; Target: any BLE-capable ESP32 (dual-mode radio). The ESP32-S3 devkit is primary (native USB-CDC);
; the classic ESP32 devkit is an alternate env. HID over GATT needs NimBLE.

[env:esp32s3]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L

lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  bblanchon/ArduinoJson@^7.0.4

build_flags =
  -DCORE_DEBUG_LEVEL=3
  ; Route Arduino Serial to native USB CDC (S3 devkit has no separate UART bridge).
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ── Classic ESP32 devkit (alternate) ──────────────────────────────────────────────────────────────
[env:esp32]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.partitions = partitions.csv

lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  bblanchon/ArduinoJson@^7.0.4

build_flags =
  -DCORE_DEBUG_LEVEL=3
